objective: alignment vs capability를 구분하고 refusal vs over-refusal, harmlessness and robustness, behavioral eval slice analysis, policy vs system-level safety를 deterministic toy behavior eval로 관찰한다.
status: runnable
prereqs:
  - post-training 단계(SFT, preference optimization, RLHF) 큰 그림 이해
  - prompt/response/role framing이 행동 조건 신호가 된다는 점
  - behavioral eval slice analysis와 failure mode 관찰 기본 감각
  - refusal vs over-refusal / harmlessness and robustness 용어 구분
  - model policy와 system guardrail 책임 분리 이해
  - capability와 deployment behavior를 분리해 보는 태도
key_terms:
  - alignment
  - capability
  - alignment vs capability
  - model behavior
  - refusal
  - over-refusal
  - refusal vs over-refusal
  - harmlessness and robustness
  - behavioral eval
  - behavioral eval slice analysis
  - slice analysis
  - safety slice
  - policy boundary
  - system guardrail
  - policy vs system-level safety
  - jailbreak robustness
  - safe alternative
  - deployment behavior
required_outputs:
  - runnable README with real execution examples
  - theory markdown
  - prereqs markdown
  - lesson metadata
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
analysis_questions:
  - alignment vs capability를 분리하지 않으면 capability score가 어떤 unsafe compliance를 숨길 수 있는가?
  - refusal vs over-refusal은 benign, harmful, borderline behavioral slice에서 어떻게 구분되는가?
  - harmlessness and robustness는 단순 refusal rate보다 어떤 추가 행동을 요구하는가?
  - behavioral eval slice analysis는 단일 judge score가 놓치는 어떤 failure mode를 보여 주는가?
  - jailbreak-style prompt뿐 아니라 paraphrase와 noisy prompt를 robustness 평가에 넣어야 하는 이유는 무엇인가?
  - policy vs system-level safety 관점에서 model policy와 system guardrail은 각각 어떤 안전 책임을 맡아야 하는가?
