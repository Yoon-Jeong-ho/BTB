objective: retrieval로 외부 근거를 붙인 생성 시스템을 retriever-reader / retriever-generator, grounding/citation 기대, offline/online evaluation harness 관점에서 함께 이해한다.
status: outlined
prereqs:
  - embedding similarity / top-k retrieval / reranking 기초
  - question answering과 evidence reading 기본 감각
  - prompt / context window / instruction framing 기본 용어
  - chunking / metadata / source freshness가 retrieval에 주는 영향 이해
  - answer correctness와 groundedness / citation adequacy 구분
  - offline metric과 online product metric의 역할 차이 이해
key_terms:
  - retrieval augmented generation
  - RAG
  - parametric memory
  - external memory
  - retriever
  - reranker
  - reader
  - generator
  - grounding
  - citation
  - chunking
  - context injection
  - recall at k
  - MRR
  - nDCG
  - groundedness
  - faithfulness
  - citation precision
  - abstention
required_outputs:
  - outlined README
  - theory markdown
  - prereqs markdown
  - lesson metadata
  - artifacts placeholder
  - future retrieval-trace and evaluation-harness sample contract
analysis_questions:
  - retrieval은 언제 parametric LM을 실제로 보완하고, 언제 irrelevant context만 늘리는가?
  - retriever-reader와 retriever-generator는 evidence 사용 방식과 failure pattern이 어떻게 다른가?
  - citation이 있다는 것과 claim-level grounding이 확보됐다는 것은 왜 같은 말이 아닌가?
  - chunking, top-k, reranking, prompt placement는 어떤 context injection failure를 만들 수 있는가?
  - retrieval metric과 answer grounding metric은 왜 따로 봐야 하며, online acceptance/correction metric과는 어떻게 어긋날 수 있는가?
  - evidence가 부족하거나 source가 충돌할 때 answer, abstain, ask-back 중 무엇을 어떻게 평가해야 하는가?
