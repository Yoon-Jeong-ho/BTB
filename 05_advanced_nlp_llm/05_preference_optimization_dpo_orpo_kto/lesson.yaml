objective: chosen/rejected pair와 desirable/undesirable label을 이용해 DPO, ORPO, KTO가 full RL loop 없이 policy log-prob margin을 어떻게 움직이는지 이해한다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 120
compute: cpu
status: runnable
prereqs:
  - supervised fine-tuning(SFT) 기본 감각
  - token log-probability / negative log likelihood / log-prob margin 기초
  - chosen/rejected pair와 desirable/undesirable label 차이 이해
  - reference policy / anchor / KL-style drift guardrail 직관
  - offline alignment eval과 held-out regression 점검 이해
key_terms:
  - preference optimization
  - chosen/rejected pair
  - desirability label
  - log-prob margin
  - DPO
  - direct preference optimization
  - ORPO
  - odds ratio preference optimization
  - KTO
  - Kahneman-Tversky optimization
  - reference policy
  - policy update without full RL
  - alignment eval tradeoff
  - length bias
  - style over factuality
required_outputs:
  - runnable README with real execution examples
  - theory markdown
  - prereqs markdown
  - lesson metadata
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
analysis_questions:
  - chosen/rejected pair는 정답/오답 label과 어떻게 다르고, log-prob margin 해석을 어떻게 바꾸는가?
  - DPO는 reference-relative chosen/rejected margin으로 policy drift와 preference separation을 어떻게 함께 보는가?
  - ORPO의 chosen likelihood anchor와 odds-ratio term은 imitation과 preference separation 사이에서 어떤 균형을 만드는가?
  - KTO는 strict pair 없이 desirable/undesirable label을 쓸 수 있지만 어떤 label noise와 imbalance 위험을 더 크게 받는가?
  - policy update without full RL로 개선된 offline margin이 실제 alignment eval tradeoff까지 해결했다는 뜻이 아닌 이유는 무엇인가?
  - win rate, factuality, refusal balance, verbosity, style bias를 어떻게 분리해서 평가할 것인가?
