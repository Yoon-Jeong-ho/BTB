objective: causal LM, masked LM, span corruption을 target framing 관점에서 비교하고, loss-mask density와 context window intuition이 objective별로 어떻게 달라지는지 runnable toy 실험으로 이해한다.
status: runnable
prereqs:
  - token, vocabulary, logit, cross entropy 기본 감각
  - autoregressive next-token prediction 이해
  - [MASK] 및 sentinel token의 역할 이해
  - encoder-only / decoder-only / encoder-decoder 구분
  - context window와 self-attention 기본 직관
key_terms:
  - causal LM
  - masked LM
  - span corruption
  - target framing
  - loss-mask density
  - context window
  - sentinel token
  - denoising pretraining
  - next-token prediction
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
analysis_questions:
  - causal LM, masked LM, span corruption은 각각 무엇을 입력으로 보고 무엇을 정답으로 삼는가?
  - target framing이 달라질 때 loss-mask density와 scored token 수는 어떻게 달라지는가?
  - 같은 context window여도 causal LM, masked LM, span corruption의 visible context는 왜 다르게 느껴지는가?
  - span corruption에서 sentinel token은 어떤 bookkeeping 역할을 하는가?
  - 이 비교는 다음 단위의 tokenizer/data mixture와 later domain-adaptive pretraining을 어떤 질문으로 바라보게 만드는가?
