objective: "base LM에 같은 pretraining objective를 유지한 채 특정 domain corpus로 continued pretraining을 수행할 때 specialization gain, forgetting risk, data selection/stopping trade-off를 함께 읽는다."
status: outlined
prereqs:
  - causal / masked / span corruption objective 비교 감각
  - corpus quality, tokenizer, mixture 설계 기본 이해
  - validation loss / perplexity / held-out set 기초
  - domain shift와 distribution mismatch 직관
  - continued pretraining과 fine-tuning의 차이 이해
  - catastrophic forgetting 기본 개념
key_terms:
  - domain adaptive pretraining
  - DAPT
  - continued pretraining
  - domain shift
  - specialization
  - catastrophic forgetting
  - retention
  - replay mixture
  - overspecialization
  - validation loss
  - stopping criterion
  - in-domain evaluation
  - general-domain retention
required_outputs:
  - outlined README
  - theory markdown
  - prereqs markdown
  - lesson metadata
  - artifacts placeholder
  - future continued-pretraining sample contract
analysis_questions:
  - DAPT는 from-scratch pretraining이나 일반 fine-tuning과 무엇이 다르고, 같은 objective를 유지한다는 점이 왜 중요한가?
  - domain shift가 vocabulary, 문체, 문서 형식, 최신성 차원에서 클 때 어떤 specialization 이득이 생길 수 있는가?
  - pure-domain continued pretraining과 general replay mixture는 adaptation speed와 catastrophic forgetting을 어떻게 다르게 만드는가?
  - domain corpus selection에서 품질, 중복, 라이선스, 오염, 최신성은 왜 문서 수보다 먼저 검토돼야 하는가?
  - stop 시점은 in-domain loss, general retention, downstream probe를 함께 볼 때 어떻게 달라지는가?
