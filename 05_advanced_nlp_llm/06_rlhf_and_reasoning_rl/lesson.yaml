objective: reward model intuition, PPO/RLHF high-level loop, verifier/judge signal, reasoning-oriented reward shaping을 연결해 RLHF와 reasoning RL이 어떤 policy update를 만들고 어떤 failure mode를 낳을 수 있는지 이해한다.
status: runnable
prereqs:
  - supervised fine-tuning(SFT) 기본 감각
  - preference optimization(DPO / ORPO / KTO) high-level 이해
  - reward / policy / rollout / advantage / KL anchor 용어 직관
  - offline preference optimization과 online RLHF rollout 차이
  - verifier signal / judge score / factuality / safety가 다른 평가 축이라는 이해
key_terms:
  - RLHF
  - reinforcement learning from human feedback
  - reward model
  - reward model intuition
  - preference proxy
  - online rollout
  - PPO/RLHF high-level loop
  - PPO-family policy update
  - advantage
  - KL anchor
  - reasoning RL
  - outcome reward
  - process reward
  - reasoning-oriented reward shaping
  - verifier/judge signal
  - reward hacking
  - verbosity inflation
  - over-refusal
  - judge length bias
required_outputs:
  - runnable README with real execution examples
  - theory markdown
  - prereqs markdown
  - lesson metadata
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
analysis_questions:
  - reward model intuition은 왜 reward를 truth engine이 아니라 preference proxy로 읽게 하는가?
  - PPO/RLHF high-level loop에서 rollout, reward scoring, policy update, regression eval은 어떤 순서로 이어지는가?
  - verifier/judge signal은 각각 어떤 장점과 bias를 갖는가?
  - reasoning-oriented reward shaping은 final answer reward와 process reward를 어떻게 섞어야 하는가?
  - reward hacking, verbosity inflation, over-refusal을 어떤 held-out eval slice로 관찰할 것인가?
  - KL anchor가 없을 때 PPO-family policy update가 어떤 drift 위험을 키울 수 있는가?
