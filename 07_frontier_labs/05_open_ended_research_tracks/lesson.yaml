objective: open-ended frontier research를 막연한 자유 탐색이 아니라 research scope·north-star question·hypothesis registry·iteration boundary·kill criteria·evidence standard·archive discipline으로 운영하고, negative result와 inconclusive result를 구분해 stop / pause / escalate / archive 결정을 내리는 기준선을 CPU-safe deterministic simulation으로 만든다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 180
compute: cpu
unit: 05_open_ended_research_tracks
track: 07_frontier_labs
status: runnable
runtime: cpu-safe deterministic simulation
cpu_safe: true
deterministic: true
prereqs:
  - capstone goal, benchmark contract, non-goal을 문장으로 고정하는 기본 문서화 감각
  - planner / executor / verifier / critic 역할 분리가 실험 해석력을 지키는 이유에 대한 이해
  - baseline-relative comparison과 failure slice observation을 함께 남겨야 한다는 평가 감각
  - retry budget, stopping rule, escalation rule이 없는 탐색이 wandering으로 흐를 수 있다는 문제의식
  - benchmark drift / contamination / protocol mismatch가 exploratory result 해석을 보류하게 만들 수 있다는 인식
  - negative result와 inconclusive result를 구분해 archive해야 다음 행동을 다르게 고를 수 있다는 이해
key_terms:
  - open-ended research
  - research scope
  - north-star question
  - out-of-scope
  - hypothesis registry
  - falsifiability
  - iteration boundary
  - kill criteria
  - evidence standard
  - baseline-relative signal
  - negative result
  - inconclusive result
  - stop decision
  - pause decision
  - escalate decision
  - archive decision
  - reopen condition
  - scope creep
scripts:
  scratch: scratch_lab.py
  framework: framework_lab.py
  analysis: analysis.py
required_outputs:
  - runnable README
  - theory note
  - prerequisite checklist
  - lesson metadata
  - artifacts/scratch-manual/metrics.json
  - artifacts/scratch-manual/research_track_map.svg
  - artifacts/framework-manual/metrics.json
  - artifacts/analysis-manual/latest_report.md
  - stable analysis markdown
  - reflection worksheet
analysis_questions:
  - open-ended research는 왜 자유 탐색이 아니라 research scope와 north-star question을 작게 자르는 운영 문제인가?
  - 좋은 hypothesis registry는 어떤 claim / mechanism / iteration boundary / kill criteria / evidence standard 조합을 가져야 keep/kill 판단이 가능한가?
  - iteration boundary 없이 exploratory run을 반복하면 어떤 retrospective story-telling과 scope creep가 생기는가?
  - exploratory goal에서도 baseline-relative signal, slice observation, qualitative memo, negative result를 함께 남겨야 하는 이유는 무엇인가?
  - negative result와 inconclusive result를 각각 archive와 pause로 다뤄야 하는 이유는 무엇인가?
  - trust failure가 보이면 왜 더 실험하지 않고 escalate해야 하는가?
  - archive discipline과 reopen condition이 있어야 다음 사람이 같은 질문을 어떻게 더 싸고 정직하게 다시 열 수 있는가?
