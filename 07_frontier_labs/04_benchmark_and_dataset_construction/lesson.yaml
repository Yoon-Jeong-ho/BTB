objective: CPU-safe toy benchmark records로 benchmark card, task contract, dataset schema, source/split manifest, annotation QC, leakage / contamination / drift audit, versioning, report template를 직접 구성해 frontier 연구의 측정 계약을 runnable artifact로 만든다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 150
compute: cpu
status: runnable
prereqs:
  - baseline, metric, acceptance gate를 먼저 고정하는 실험 설계 감각
  - train/dev/test split과 leakage 문제에 대한 기본 이해
  - deduplication과 contamination audit가 서로 다른 목적을 가진다는 이해
  - annotation rubric, disagreement, adjudication이 label 품질에 미치는 영향 이해
  - slice evaluation과 long-tail failure를 함께 읽는 평가 관점
  - dataset versioning과 benchmark refresh의 trade-off에 대한 기본 인식
key_terms:
  - benchmark card
  - task contract
  - dataset schema
  - source/split manifest
  - unit of record
  - split hygiene
  - holdout
  - annotation rubric
  - annotation QC
  - adjudication
  - leakage
  - contamination
  - benchmark drift
  - slice evaluation
  - versioning
  - report template
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
analysis_questions:
  - task contract를 먼저 고정하면 benchmark score가 허용하는 claim boundary가 어떻게 선명해지는가?
  - dataset schema에는 source boundary, unit of record, license tier, version freeze가 왜 함께 들어가야 하는가?
  - source/split manifest는 random split을 넘어 어떤 축의 disjointness를 요구하고, 그 이유는 무엇인가?
  - annotation QC는 agreement score 외에 major disagreement와 adjudication rule을 왜 같이 남겨야 하는가?
  - leakage / contamination / drift audit는 각각 무엇이 다르고 benchmark report에서 어떤 warning으로 이어지는가?
  - benchmark versioning과 report template가 다음 open-ended research track의 stopping rule과 evidence 기준에 어떻게 연결되는가?
