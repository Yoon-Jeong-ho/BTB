objective: 논문 전체를 복제하려 하기보다 핵심 claim을 claim/evidence matrix로 자르고, baseline/reported/reproduced comparison, scope control, variance/mismatch hypotheses, artifact hygiene를 갖춘 runnable paper reproduction playground를 만든다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 120
compute: cpu
status: runnable
cpu_safe: true
deterministic: true
prereqs:
  - baseline과 metric을 같은 조건에서 비교하는 기본 모델 해석 감각
  - learning curve / seed / batch / runtime budget이 결과에 주는 영향 이해
  - absolute result와 relative trend를 구분하는 습관
  - preprocessing / evaluator / hardware mismatch 가능성에 대한 인식
  - 실험 로그와 metadata를 남겨야 재현성 논의가 가능하다는 이해
key_terms:
  - paper reproduction
  - claim/evidence matrix
  - reproduction scope
  - scope control
  - baseline
  - reported result
  - reproduced result
  - baseline/reported/reproduced comparison
  - variance
  - mismatch hypothesis
  - preprocessing alignment
  - evaluation protocol
  - artifact hygiene
  - experiment card
  - reduced claim
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - observed analysis report
  - stable analysis markdown
  - reflection markdown
  - claim/evidence matrix
  - baseline/reported/reproduced comparison
  - variance/mismatch hypotheses
  - artifact hygiene checklist
scripts:
  - scratch_lab.py
  - framework_lab.py
  - analysis.py
analysis_questions:
  - full paper reproduction과 claim-level reproduction은 어떻게 다른가?
  - compute/time 제약이 있을 때 reproduction scope를 어디까지 줄이면 정직하고 해석 가능하다고 말할 수 있는가?
  - baseline은 왜 paper 표의 숫자만으로 충분하지 않고 같은 protocol 아래 재실행 비교가 필요한가?
  - baseline/reported/reproduced comparison에서 primary comparison은 어느 층이어야 하는가?
  - reported result와 reproduced result가 다를 때 variance, preprocessing, evaluator, hardware 차이를 어떤 순서로 의심해야 하는가?
  - mismatch hypothesis를 실패 핑계가 아니라 다음 실험 설계로 바꾸려면 어떤 artifact hygiene가 필요한가?
