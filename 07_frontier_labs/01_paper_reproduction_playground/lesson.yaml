objective: 논문 한 편을 통째로 흉내 내기보다 핵심 claim을 작은 reproduction 계약으로 자르고, baseline/metric/artifact 기준을 명시해 재현 가능한 연구 playground의 출발점을 만든다.
status: outlined
prereqs:
  - baseline과 metric을 같은 조건에서 비교하는 기본 모델 해석 감각
  - learning curve / seed / batch / runtime budget이 결과에 주는 영향 이해
  - absolute result와 relative trend를 구분하는 습관
  - preprocessing / evaluator / hardware mismatch 가능성에 대한 인식
  - 실험 로그와 metadata를 남겨야 재현성 논의가 가능하다는 이해
key_terms:
  - paper reproduction
  - reproduction scope
  - claim
  - evidence
  - baseline
  - reported result
  - reproduced result
  - variance
  - preprocessing
  - evaluation protocol
  - artifact hygiene
  - experiment card
  - mismatch hypothesis
required_outputs:
  - outlined README
  - theory note
  - prerequisite checklist
  - lesson metadata
  - artifacts placeholder
  - future claim to experiment mapping sample contract
  - future baseline vs reported vs reproduced comparison sample contract
  - future reproduction log / mismatch memo sample contract
analysis_questions:
  - full paper reproduction과 claim-level reproduction은 어떻게 다른가?
  - compute/time 제약이 있을 때 reproduction scope를 어디까지 줄이면 정직하고 해석 가능하다고 말할 수 있는가?
  - baseline은 왜 paper 표의 숫자만으로 충분하지 않고 같은 protocol 아래 재실행 비교가 필요한가?
  - reported result와 reproduced result가 다를 때 variance, preprocessing, evaluator, hardware 차이를 어떤 순서로 의심해야 하는가?
  - 숫자 일치 여부 외에 claim/evidence 관점에서 꼭 남겨야 할 artifact는 무엇인가?
  - 이 단위의 reproduction log가 다음 capstone 모델 빌딩 단위의 실험 계약으로 어떻게 이어질 수 있는가?
