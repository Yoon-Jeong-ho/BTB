objective: ZeRO가 data parallel 중복 상태를 단계별로 shard해 per-rank memory를 줄이는 방식을 toy memory accounting으로 이해한다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 90
compute: cpu
status: runnable
prereqs:
  - DDP와 data parallel 기초
  - parameter / gradient / optimizer state 구분
  - rank/world size 실행 계약
key_terms:
  - DeepSpeed
  - ZeRO
  - optimizer state
  - gradient sharding
  - parameter sharding
  - memory accounting
  - communication overhead
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
analysis_questions:
  - ZeRO stage별로 어떤 상태가 shard되는가?
  - per-rank memory는 얼마나 줄어드는가?
  - 메모리 절약과 통신/복구 복잡도는 어떻게 trade-off를 이루는가?
