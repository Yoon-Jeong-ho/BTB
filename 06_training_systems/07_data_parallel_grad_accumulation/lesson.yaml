objective: data parallel과 grad accumulation을 함께 실행 가능한 CPU-safe simulation으로 관찰하며 local/global/effective batch, deferred sync/no_sync, optimizer step cadence, loss normalization, gradient clipping, throughput/memory trade-off를 later hybrid parallel 학습의 기준선으로 삼는다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 120
compute: cpu
unit: 07_data_parallel_grad_accumulation
track: 06_training_systems
status: runnable
cpu_safe: true
deterministic: true
runtime: cpu-safe deterministic simulation
prereqs:
  - backward와 optimizer step 기본 감각
  - local batch와 GPU memory pressure 관계 이해
  - DDP의 rank/world size/gradient synchronization 기초
  - effective batch와 learning-rate 해석 기본 관점
  - throughput, latency, utilization을 분리해서 보는 운영 감각
