objective: torchrun이 만드는 rank/world-size 실행 계약과 DDP gradient averaging 직관을 CPU-safe simulation으로 이해한다.
status: runnable
prereqs:
  - mini-batch와 gradient 기본 감각
  - optimizer step 이해
  - device와 process 구분
key_terms:
  - torchrun
  - distributed data parallel
  - rank
  - local rank
  - world size
  - all-reduce
  - gradient averaging
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
analysis_questions:
  - rank와 local rank는 각각 무엇을 설명하는가?
  - DDP는 무엇을 복제하고 무엇을 평균내는가?
  - 평균 gradient가 parameter update를 어떻게 바꾸는가?
