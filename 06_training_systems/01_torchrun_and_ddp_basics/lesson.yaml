objective: CPU-safe simulation과 선택 2-process torchrun 실험으로 rank/world-size 계약과 DDP all-reduce를 이해한다.
fidelity: framework-toy
difficulty: advanced
estimated_minutes: 150
compute: optional-multiprocess
status: runnable
prereqs:
  - mini-batch와 gradient 기본 감각
  - optimizer step 이해
  - device와 process 구분
key_terms:
  - torchrun
  - distributed data parallel
  - rank
  - local rank
  - world size
  - all-reduce
  - gradient averaging
  - process group
  - gloo backend
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
analysis_questions:
  - rank와 local rank는 각각 무엇을 설명하는가?
  - DDP는 무엇을 복제하고 무엇을 평균내는가?
  - 평균 gradient가 parameter update를 어떻게 바꾸는가?
