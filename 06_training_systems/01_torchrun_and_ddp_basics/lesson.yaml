objective: single-process 학습을 distributed launch로 올릴 때 필요한 torchrun, world size/rank/local rank, main-process 운영 규칙, DDP gradient synchronization 직관을 연결해 이후 training systems 단위의 공통 좌표계를 만든다.
status: outlined
prereqs:
  - backward와 optimizer step 기본 감각
  - GPU 하나에서 모델/optimizer/batch가 연결되는 방식 이해
  - batch size와 학습 로그 해석 기본기
  - Python process의 독립 실행 감각
  - main-rank logging 필요성을 받아들일 수 있는 운영 직관
key_terms:
  - torchrun
  - distributed launch
  - process group
  - rendezvous
  - world size
  - rank
  - local rank
  - main process
  - DDP
  - DistributedDataParallel
  - gradient synchronization
  - all-reduce
  - local batch
  - global batch
required_outputs:
  - outlined README
  - theory note
  - prerequisite checklist
  - lesson metadata
  - artifacts placeholder
  - future per-rank environment snapshot sample contract
  - future DDP sync summary sample contract
analysis_questions:
  - single-process 학습과 distributed launch의 가장 큰 차이는 무엇이며, 왜 process identity가 중요해지는가?
  - world size, rank, local rank는 각각 무엇을 세고 어떤 운영 판단에 쓰이는가?
  - torchrun은 왜 단순 convenience wrapper가 아니라 distributed initialization 계약의 핵심인가?
  - DDP는 각 rank가 서로 다른 데이터를 보면서도 어떻게 같은 방향의 parameter update를 유지하는가?
  - local batch와 global/effective batch를 구분하지 않으면 어떤 해석 오류가 생길 수 있는가?
  - 왜 logging, evaluation, checkpointing을 main process 기준으로 정리해야 하는가?
