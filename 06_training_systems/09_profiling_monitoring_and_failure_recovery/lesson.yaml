objective: profiling, monitoring, failure recovery를 한 runbook으로 묶어 large-model 학습에서 time/memory/communication 병목을 읽고 OOM·hang·divergence·checkpoint resume 문제를 체계적으로 triage하는 기준선을 CPU-safe deterministic simulation으로 만든다.
fidelity: concept-toy
difficulty: advanced
estimated_minutes: 150
compute: cpu
unit: 09_profiling_monitoring_and_failure_recovery
track: 06_training_systems
status: runnable
runtime: cpu-safe deterministic simulation
cpu_safe: true
deterministic: true
prereqs:
  - training step과 throughput / step time 기본 감각
  - loss / grad norm / optimizer step 로그 해석 기본기
  - GPU memory allocated / reserved / peak 개념 이해
  - distributed runtime에서 rank 간 대기와 communication 병목 기초
  - checkpoint가 restart state 계약이라는 점에 대한 이해
  - OOM / hang / divergence를 구분해 보려는 운영 관점
key_terms:
  - profiling
  - profiler trace
  - hotspot
  - step timeline
  - throughput
  - step time jitter
  - monitoring snapshot
  - heartbeat
  - GPU utilization
  - allocated memory
  - reserved memory
  - peak memory
  - fragmentation
  - communication wait
  - checkpoint
  - manifest
  - resume
  - recovery
  - recovery decision
  - retry policy
  - preemption
  - OOM
  - hang
  - divergence
scripts:
  scratch: scratch_lab.py
  framework: framework_lab.py
  analysis: analysis.py
required_outputs:
  - runnable README
  - theory note
  - prerequisite checklist
  - lesson metadata
  - artifacts/scratch-manual/metrics.json
  - artifacts/scratch-manual/profiling_timeline.svg
  - artifacts/framework-manual/metrics.json
  - artifacts/analysis-manual/latest_report.md
  - stable analysis markdown
  - reflection worksheet
analysis_questions:
  - 느린 학습 run을 time / memory / communication 축으로 나누면 어떤 병목 가설을 더 빨리 세울 수 있는가?
  - average step time만으로는 놓치기 쉬운 jitter, tail latency, phase-boundary slowdown은 왜 중요한가?
  - allocated / reserved / peak memory와 checkpoint freshness, per-rank heartbeat를 함께 보면 어떤 failure를 더 빨리 구분할 수 있는가?
  - OOM, hang, divergence, storage/checkpoint failure는 각각 어떤 첫 관찰 포인트와 triage 순서를 요구하는가?
  - recoverable checkpoint는 어떤 state와 metadata를 포함해야 하며, post-resume validation은 왜 별도 단계로 필요할까?
  - retry와 recovery decision은 언제 안전하고, 언제 checkpoint quarantine이나 human escalation이 필요한가?
  - 이 단위의 observability / recoverability 감각이 이후 frontier labs의 paper reproduction과 capstone 운영에 어떻게 이어지는가?
