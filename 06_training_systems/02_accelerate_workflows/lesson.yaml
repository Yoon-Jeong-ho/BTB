objective: Accelerate를 PyTorch loop와 distributed backend 사이의 실행/장치 적응 계층으로 이해하고, 무엇을 단순화하며 무엇은 남기는지 구분한다.
status: runnable
prereqs:
  - torchrun/DDP rank/world-size 기초
  - PyTorch training loop 기본 구조
  - device placement와 mixed precision 기본 감각
key_terms:
  - Accelerate
  - Accelerator
  - prepare
  - device placement
  - mixed precision
  - distributed_type
  - accelerate launch
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
analysis_questions:
  - Accelerate는 어떤 boilerplate를 줄여 주는가?
  - "`prepare()` 이후에도 사용자가 직접 이해해야 하는 것은 무엇인가?"
  - mixed precision과 backend complexity는 왜 별개로 봐야 하는가?
