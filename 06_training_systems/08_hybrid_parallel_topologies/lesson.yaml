objective: data parallel, tensor parallel, pipeline parallel, FSDP/state sharding을 한 장의 topology 설계 문제로 묶어 보고, 모델 규모·메모리 병목·통신 경로·하드웨어 링크 구조를 기준으로 hybrid parallel 구성을 선택하는 감각을 CPU-safe deterministic simulation으로 만든다.
unit: 08_hybrid_parallel_topologies
track: 06_training_systems
status: runnable
runtime: cpu-safe deterministic simulation
cpu_safe: true
deterministic: true
prereqs:
  - data parallel / tensor parallel / pipeline parallel / FSDP의 큰 그림
  - global batch, microbatch, gradient accumulation 구분
  - large Transformer의 parameter state / activation / intra-layer compute 병목 감각
  - collective communication(all-reduce, all-gather, reduce-scatter, send/recv) 기본 직관
  - node 내부 링크와 node 간 링크 차이에 대한 운영 감각
  - checkpoint save/load가 topology-aware contract가 될 수 있다는 이해
