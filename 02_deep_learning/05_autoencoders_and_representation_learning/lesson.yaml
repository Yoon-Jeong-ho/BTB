objective: reconstruction objective, encoder-latent-decoder 역할, bottleneck 직관, denoising/compression variant를 CPU-safe toy autoencoder로 직접 관찰한다.
fidelity: framework-toy
difficulty: intermediate
estimated_minutes: 120
compute: cpu
status: runnable
prereqs:
  - 입력/출력/latent tensor shape 읽기
  - activation과 reconstruction loss 구분
  - gradient와 backpropagation 기초
  - hidden representation과 feature 재사용 감각
  - 차원 축소와 정보 손실 trade-off 이해
key_terms:
  - autoencoder
  - encoder
  - decoder
  - latent representation
  - reconstruction objective
  - reconstruction loss
  - bottleneck
  - denoising autoencoder
  - compression
  - representation learning
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
  - reflection worksheet
analysis_questions:
  - reconstruction objective는 label 없이도 어떤 학습 신호를 제공하는가?
  - encoder, latent, decoder는 각각 어떤 역할을 하고 어디에서 병목이 생기는가?
  - bottleneck dimension을 줄이거나 늘리면 representation quality와 reconstruction quality는 어떻게 달라지는가?
  - denoising autoencoder와 compression-oriented autoencoder는 같은 구조를 어떻게 다르게 활용하는가?
  - latent representation이 downstream retrieval, clustering, generative modeling에 도움이 되려면 무엇을 더 관찰해야 하는가?
datasets_or_inputs:
  - 8차원 deterministic toy reconstruction vectors
  - orthogonal noise가 추가된 toy denoising vectors
models_or_tools:
  - manual basis-projection scratch autoencoder
  - tiny PyTorch linear autoencoder
  - bottleneck comparison SVG visualization
