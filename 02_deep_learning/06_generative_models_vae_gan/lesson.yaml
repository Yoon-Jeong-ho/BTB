objective: VAE와 GAN을 대비해 latent sampling, reparameterization trick, adversarial intuition, posterior collapse, mode collapse를 CPU-safe toy 예제로 직접 관찰한다.
status: runnable
prereqs:
  - encoder/decoder/latent tensor shape 읽기
  - reconstruction loss와 KL divergence 기본 직관
  - 평균, 분산, sampling 기초
  - gradient와 backpropagation 기초
  - adversarial training이 왜 불안정할 수 있는지에 대한 문제의식
key_terms:
  - variational autoencoder
  - VAE
  - generative adversarial network
  - GAN
  - latent variable
  - latent sampling
  - reparameterization trick
  - KL divergence
  - adversarial training
  - posterior collapse
  - mode collapse
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
  - reflection worksheet
analysis_questions:
  - VAE는 reconstruction term과 KL term을 함께 보며 latent를 어떻게 샘플링 가능한 공간으로 만들려 하는가?
  - reparameterization trick은 단순 noise injection과 무엇이 다르고 왜 gradient 관점에서 중요한가?
  - posterior collapse가 일어나면 latent usage, KL, reconstruction 중 무엇이 먼저 경고를 주는가?
  - GAN adversarial loss가 그럴듯해 보여도 mode collapse를 놓칠 수 있는 이유는 무엇인가?
  - sample realism, coverage, stability 세 축으로 VAE와 GAN을 어떻게 비교할 수 있는가?
datasets_or_inputs:
  - 2차원 deterministic toy four-mode points
  - fixed epsilon latent samples and fixed GAN noise vectors
models_or_tools:
  - manual VAE-vs-GAN scratch simulator
  - tiny PyTorch VAE module
  - tiny PyTorch GAN generator/discriminator diagnostics
  - SVG coverage visualization
