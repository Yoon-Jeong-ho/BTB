objective: learning rate, batch size, weight decay, scheduler가 tiny supervised 학습 곡선에 남기는 흔적을 읽고, overfit/underfit/divergence/data bug를 sanity check로 빠르게 분류하는 습관을 만든다.
fidelity: framework-toy
difficulty: intermediate
estimated_minutes: 120
compute: cpu
status: runnable
prereqs:
  - loss / metric / gradient 역할 구분
  - batch / epoch / optimizer step / global step 기본 용어
  - train/validation split과 기본 곡선 해석
  - label misalignment / NaN / shape mismatch 같은 data bug 기본 감각
key_terms:
  - learning rate
  - batch size
  - weight decay
  - scheduler
  - overfitting
  - underfitting
  - divergence
  - gradient explosion
  - data bug
  - sanity check
  - single-batch overfit
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
analysis_questions:
  - baseline과 large batch recipe는 같은 epoch budget에서 어떤 train/validation 차이를 남겼는가?
  - weight decay와 scheduler를 함께 켰을 때 validation loss trade-off는 어떻게 달라졌는가?
  - high learning rate probe는 어느 시점에서 divergence 또는 gradient explosion을 만들었는가?
  - shifted-label bug와 overfit는 로그에서 어떻게 다르게 보였는가?
  - single-batch overfit sanity check는 왜 디버깅 첫 단계로 유용한가?
