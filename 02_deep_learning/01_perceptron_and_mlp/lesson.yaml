objective: perceptron decision rule, 선형 분리 가능성, XOR 실패, tiny MLP 개선을 가장 작은 neural baseline 관점에서 이해한다.
fidelity: framework-toy
difficulty: beginner
estimated_minutes: 90
compute: cpu
status: runnable
prereqs:
  - dot product와 weighted sum 기초
  - bias와 decision boundary 직관
  - activation과 loss 구분
  - gradient와 backpropagation 기초
  - 작은 baseline 비교 감각
key_terms:
  - perceptron
  - decision rule
  - linear separability
  - single neuron
  - XOR
  - hidden layer
  - nonlinearity
  - MLP
  - neural baseline
required_outputs:
  - scratch metrics json
  - scratch svg figure
  - framework metrics json
  - stable analysis markdown
  - observed analysis report
  - reflection worksheet
analysis_questions:
  - perceptron의 decision rule은 입력을 어떤 기준으로 두 클래스로 나누는가?
  - linear separable한 경우와 XOR 같은 경우를 어떻게 구분해서 읽을 수 있는가?
  - single neuron의 XOR 실패를 optimizer 문제가 아니라 표현력 한계라고 설명하려면 어떤 관측이 필요한가?
  - tiny MLP가 같은 toy data에서 개선을 보일 때, hidden layer와 nonlinearity의 역할을 어떻게 말로 설명할 수 있는가?
datasets_or_inputs:
  - 선형 분리 가능한 2D toy points
  - XOR 스타일의 2D toy points
models_or_tools:
  - hard-threshold perceptron rule
  - tiny PyTorch single neuron
  - one-hidden-layer tiny MLP
  - decision boundary SVG visualization
