<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTB Study Map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">BTB · NLP 바보에서 박사</p>
        <h1>학습 로드맵과 개인 진행 체크</h1>
        <p class="lead">
          `catalog.json`으로 커리큘럼을 읽고, 체크/메모/진행률은 이 브라우저의
          로컬 캐시에만 저장합니다. 이 진행 상태는 GitHub에 공유되지 않습니다.
        </p>
      </div>
      <div class="hero-card" aria-live="polite">
        <span id="overall-progress">0%</span>
        <small>현재 사용자별 진행률</small>
      </div>
    </header>

    <main class="layout">
      <aside class="panel track-panel" aria-label="트랙 목록">
        <div class="panel-heading">
          <h2>트랙</h2>
          <button id="reset-filters" type="button">필터 초기화</button>
        </div>
        <div id="track-list" class="track-list"></div>
      </aside>

      <section class="panel unit-panel" aria-label="단원 목록">
        <div class="toolbar">
          <label>
            <span>검색</span>
            <input id="search" type="search" placeholder="attention, RL, VLA…" />
          </label>
          <label>
            <span>상태</span>
            <select id="progress-filter">
              <option value="all">전체</option>
              <option value="not_started">시작 전</option>
              <option value="in_progress">진행 중</option>
              <option value="done">완료</option>
              <option value="blocked">막힘</option>
            </select>
          </label>
          <button id="resume" type="button">마지막 단원 열기</button>
        </div>
        <div id="unit-list" class="unit-list"></div>
        <p id="empty-state" class="empty" hidden>조건에 맞는 단원이 없습니다. 검색어나 필터를 지워 보세요.</p>
      </section>

      <section class="panel detail-panel" aria-labelledby="detail-title">
        <div class="profile-box">
          <label>
            <span>사용자 프로필</span>
            <select id="profile-select"></select>
          </label>
          <div class="profile-actions">
            <button id="add-profile" type="button">프로필 추가</button>
            <button id="export-progress" type="button">내보내기</button>
            <button id="import-progress" type="button">가져오기</button>
            <button id="reset-progress" type="button" class="danger">로컬 진행 삭제</button>
          </div>
        </div>

        <article id="unit-detail" class="unit-detail">
          <p class="empty">단원을 선택하면 목표, 실험 산출물, 체크리스트가 여기에 표시됩니다.</p>
        </article>
      </section>
    </main>

    <dialog id="import-dialog">
      <form method="dialog" class="dialog-body">
        <h2>로컬 진행 가져오기</h2>
        <p>이 JSON은 브라우저 localStorage에만 병합됩니다. GitHub나 서버로 전송하지 않습니다.</p>
        <textarea id="import-json" rows="10" spellcheck="false"></textarea>
        <menu>
          <button value="cancel">취소</button>
          <button id="confirm-import" value="default" type="button">가져오기</button>
        </menu>
      </form>
    </dialog>

    <script src="progress-storage.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
